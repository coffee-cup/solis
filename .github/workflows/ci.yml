name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 27.0 (Swift 6.4)
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun simctl list devices available

      - name: Verify offline solar reference matrix
        run: scripts/verify-solar.sh

      - name: Run unit tests
        run: |
          simulator_id="$(scripts/ios-loop-sim.sh --shutdown-older --print-udid)"
          xcodebuild test \
            -project SunriseSunset.xcodeproj \
            -scheme SunriseSunset \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -resultBundlePath TestResults.xcresult

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult
